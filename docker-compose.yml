services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fetch_book
      POSTGRES_PASSWORD: fetch_book
      POSTGRES_DB: fetch_book
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
